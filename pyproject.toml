[project]
name = "aethergrid"
version = "1.0.0"
description = "Self-hosted, non-custodial AI-operated crypto GRID trading system for Coinbase Advanced Trade."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "AetherGrid" }]
keywords = ["crypto", "grid", "trading", "coinbase", "paper-trading"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "coinbase-advanced-py>=1.8.2",
    "openai>=1.54.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
aethergrid = "aethergrid.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.vercel]
entrypoint = "api.index:app"

[tool.hatch.build.targets.wheel.force-include]
"src/aethergrid/ui/templates" = "aethergrid/ui/templates"
"src/aethergrid/ui/static" = "aethergrid/ui/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
